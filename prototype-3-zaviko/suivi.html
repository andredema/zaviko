<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivre ma demande · Zaviko</title>
<link rel="icon" href="assets/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-base="">
<div id="site-header"></div>
<main class="wrap narrow" style="padding-top:24px;padding-bottom:40px">
  <div class="stack" style="--gap:16px">
    <div id="banner"></div>
    <h1 style="font-size:clamp(28px,5vw,38px)">Suivre ma demande</h1>
    <form class="row" id="code-form" style="--gap:8px">
      <label class="sr-only" for="code">Code de suivi</label>
      <input id="code" type="text" placeholder="Ex. : ZK-4821" style="flex:1;min-width:160px;height:48px;border-radius:12px;border:1px solid var(--field);padding:0 14px;font-size:16px;text-transform:uppercase">
      <button class="btn btn-dark" type="submit">Voir</button>
    </form>
    <p class="xsmall muted">Le code est envoyé par texto après chaque demande. Pas besoin de compte. Code de démonstration : <b>ZK-4821</b>.</p>
    <div id="result" class="stack" style="--gap:16px"></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  Z.header(); Z.footer();
  const d = Z.D.demandeDemo;
  const input = document.getElementById('code');
  input.value = Z.param('code') || '';

  if (Z.param('nouveau')) {
    document.getElementById('banner').innerHTML = `
      <div class="card row" style="--gap:12px;background:var(--teal-l);border-color:var(--teal-l)">
        <span style="color:var(--teal-dd)">${Z.icon('check', 24)}</span>
        <span class="small"><b>Demande envoyée.</b> Garde ce code : <b>${d.code}</b>. Tu l’as aussi reçu par texto.</span>
      </div>`;
  }

  function show(code) {
    const out = document.getElementById('result');
    if (!code) { out.innerHTML = ''; return; }
    if (code.toUpperCase() !== d.code) {
      out.innerHTML = `<div class="card"><b>Code introuvable.</b> <span class="muted">Vérifie le texto reçu, ou essaie le code de démonstration ${d.code}.</span></div>`;
      return;
    }
    out.innerHTML = `
      <section class="card stack" style="--gap:10px">
        <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">${Z.esc(d.service)}</h2><span class="status st-new">${d.reponses.length} réponses</span></div>
        <p style="color:var(--ink-2)">${Z.esc(d.description)}</p>
        <p class="small muted">${Z.esc(d.quand)} · ${Z.esc(d.lieu)} · code ${d.code}</p>
        <ol class="timeline" style="margin-top:6px">
          <li class="done"><span class="num">1</span><span><b>Demande envoyée</b><br><span class="small muted">À 3 pros vérifiés de ta zone</span></span></li>
          <li class="done"><span class="num">2</span><span><b>Réponses reçues</b><br><span class="small muted">Compare et choisis</span></span></li>
          <li class="on"><span class="num">3</span><span><b>Choisis ton pro</b><br><span class="small muted">Appelle-le ou accepte son devis</span></span></li>
        </ol>
      </section>
      <h2 style="font-size:20px">Réponses des pros</h2>
      ${d.reponses.map(r => { const p = Z.pro(r.pro); return `
        <article class="card stack" style="--gap:12px">
          <a class="pro-head" href="pro.html?id=${p.id}">${Z.avatar(p)}<span class="stack" style="--gap:2px"><span class="pro-name">${Z.esc(Z.displayName(p))} · ${Z.esc(p.metier)}</span>${Z.stars(p)}</span></a>
          <p style="color:var(--ink-2)">« ${Z.esc(r.message)} »</p>
          <div class="row" style="justify-content:space-between"><span class="small muted">Prix proposé</span><b class="display" style="font-size:22px">${Z.esc(r.prix)}</b></div>
          <div class="two">
            <a class="btn btn-primary" href="contact.html?id=${p.id}&mode=appel">${Z.icon('phone', 16)}Appeler</a>
            <button class="btn btn-outline" type="button" data-accept="${p.prenom}">Accepter le devis</button>
          </div>
        </article>`; }).join('')}
      <button class="btn btn-ghost" type="button" data-proto="Prototype : ta demande serait fermée et les pros prévenus.">Annuler ma demande</button>`;
  }

  document.getElementById('result').addEventListener('click', (e) => {
    const b = e.target.closest('[data-accept]'); if (!b) return;
    b.outerHTML = `<span class="btn btn-dark" style="cursor:default">${Z.icon('check', 16)}Devis accepté</span>`;
    Z.toast(`${b.dataset.accept} est prévenu et va te contacter pour fixer l’heure.`);
  });
  document.getElementById('code-form').addEventListener('submit', (e) => { e.preventDefault(); show(input.value.trim()); });
  show(input.value.trim());
</script>
</body>
</html>
