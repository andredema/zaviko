<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urgence · Zaviko</title>
<link rel="icon" href="assets/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-base="">
<div id="site-header"></div>
<main class="wrap narrow" style="padding-top:24px;padding-bottom:40px">
  <div class="stack" style="--gap:18px" id="pick">
    <h1 style="font-size:clamp(28px,5vw,40px)">Besoin de quelqu’un <span style="color:var(--teal-d)">maintenant</span> ?</h1>
    <p class="muted">Choisis le type de problème. On trouve le premier pro vérifié libre près de toi.</p>
    <div class="tiles" id="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr))"></div>
    <label class="field">Où es-tu ?
      <input id="lieu" type="text" value="Gatineau · secteur Hull">
    </label>
  </div>
  <div id="search" class="stack center" style="--gap:16px;display:none;padding:40px 0">
    <div class="loader" aria-hidden="true"></div>
    <h2 style="font-size:24px" id="search-title">Recherche du premier pro libre…</h2>
    <p class="muted">On vérifie les pros disponibles dans ton secteur.</p>
  </div>
  <div id="found" class="stack" style="--gap:16px;display:none"></div>
</main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  Z.header(); Z.footer();
  const urg = Z.D.categories.filter(c => c.urgence).concat(Z.D.categories.filter(c => !c.urgence).slice(0, 1));
  document.getElementById('tiles').innerHTML = urg.map(c =>
    `<button class="tile" type="button" data-cat="${c.id}" style="cursor:pointer">${Z.icon(c.icon, 28)}${Z.esc(c.nom)}</button>`).join('');

  document.getElementById('tiles').addEventListener('click', (e) => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    const c = Z.cat(b.dataset.cat);
    document.getElementById('pick').style.display = 'none';
    document.getElementById('search').style.display = '';
    document.getElementById('search-title').textContent = `Recherche d’un pro en ${c.nom.toLowerCase()}…`;
    const list = Z.D.pros.filter(p => p.cat === c.id).sort((a, b) => Z.D.dispo[a.dispo].rang - Z.D.dispo[b.dispo].rang);
    setTimeout(() => {
      document.getElementById('search').style.display = 'none';
      const f = document.getElementById('found'); f.style.display = '';
      const p = list[0];
      if (!p) {
        f.innerHTML = `<div class="card empty stack" style="--gap:10px"><h2 style="font-size:22px">Personne n’est libre pour l’instant</h2><p class="muted">Laisse ta demande, le premier pro disponible te rappelle.</p><div><a class="btn btn-dark" href="devis.html">Laisser ma demande</a></div></div>`;
        return;
      }
      f.innerHTML = `
        <div class="card row" style="--gap:10px;background:var(--teal-l);border-color:var(--teal-l)"><span style="color:var(--teal-dd)">${Z.icon('check', 22)}</span><b>Pro trouvé · ${Z.esc(Z.D.dispo[p.dispo].label.toLowerCase())}</b></div>
        <section class="card stack" style="--gap:12px;align-items:center;text-align:center">
          ${Z.avatar(p, 88)}
          <h1 style="font-size:28px">${Z.esc(Z.displayName(p))} · ${Z.esc(p.metier)}</h1>
          <p class="muted">${Z.esc(p.secteur)}, ${Z.esc(p.ville)} · ${Z.stars(p)}</p>
          <a class="btn btn-primary btn-lg btn-block" href="contact.html?id=${p.id}&mode=appel">${Z.icon('phone', 20)}Appeler ${Z.esc(p.prenom)}</a>
          <a class="btn btn-outline btn-block" href="pro.html?id=${p.id}">Voir son profil</a>
        </section>
        ${list.length > 1 ? `<h2 style="font-size:18px">Autres pros ${list.length > 2 ? 'disponibles' : 'disponible'}</h2>${list.slice(1).map(Z.proCard).join('')}` : ''}
        <a class="btn btn-ghost" href="urgence.html">Changer de catégorie</a>`;
    }, 1600);
  });
</script>
</body>
</html>
