<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demander un devis · Zaviko</title>
<link rel="icon" href="assets/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-base="">
<div id="site-header"></div>
<main class="wrap narrow" style="padding-top:24px;padding-bottom:40px">
  <form class="stack" id="form" style="--gap:18px" novalidate>
    <div class="stack" style="--gap:6px">
      <span class="small muted">Une seule page · moins d’une minute · sans compte</span>
      <h1 style="font-size:clamp(28px,5vw,38px)">De quoi as-tu besoin ?</h1>
      <div id="target"></div>
    </div>

    <label class="field">Service
      <select id="service" data-required></select>
      <span class="err">Choisis un service.</span>
    </label>

    <label class="field">Décris en quelques mots
      <textarea id="desc" data-required rows="3" placeholder="Ex. : fuite sous l’évier de la cuisine"></textarea>
      <span class="err">Décris ton besoin en quelques mots.</span>
    </label>

    <fieldset style="border:0;padding:0;margin:0" class="stack">
      <legend class="small" style="font-weight:600;padding:0;margin-bottom:8px">Quand ?</legend>
      <div class="row" data-choices style="--gap:8px;flex-wrap:nowrap">
        <button class="choice" type="button" aria-pressed="true">Aujourd’hui</button>
        <button class="choice" type="button" aria-pressed="false">Cette semaine</button>
        <button class="choice" type="button" aria-pressed="false">Flexible</button>
      </div>
    </fieldset>

    <div class="two">
      <label class="field">Code postal
        <input data-required type="text" placeholder="J8X 1A1">
        <span class="err">Indique ton code postal.</span>
      </label>
      <label class="field">Téléphone ou courriel
        <input data-required type="text" placeholder="Pour recevoir les réponses">
        <span class="err">Indique comment te joindre.</span>
      </label>
    </div>

    <label class="field">Photo (facultatif) <span class="hint">Une photo aide le pro à estimer le prix.</span>
      <span class="drop"><span id="up-icon"></span><span id="up-label">Ajouter une photo</span><input type="file" accept="image/*" id="photo"></span>
    </label>

    <button class="btn btn-dark btn-lg" type="submit">Recevoir des réponses</button>

    <div class="card stack" style="--gap:8px;background:var(--mist);border:0">
      <span class="row small" style="--gap:8px"><span id="c1"></span>Sans compte, sans mot de passe</span>
      <span class="row small" style="--gap:8px"><span id="c2"></span>Seuls les pros vérifiés de ta zone répondent</span>
      <span class="row small" style="--gap:8px"><span id="c3"></span>Suivi de ta demande par un code reçu par texto</span>
    </div>
  </form>
</main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  Z.header(); Z.footer();
  const p = Z.pro(Z.param('pro'));
  ['c1', 'c2', 'c3'].forEach(id => document.getElementById(id).outerHTML = `<span style="color:var(--teal-d)">${Z.icon('check', 16)}</span>`);
  document.getElementById('up-icon').outerHTML = Z.icon('upload', 20);
  const sel = document.getElementById('service');
  sel.innerHTML = '<option value="">Choisir…</option>' + Z.D.categories.map(c => `<option value="${c.id}" ${p && p.cat === c.id ? 'selected' : ''}>${Z.esc(c.nom)}</option>`).join('');
  document.getElementById('target').innerHTML = p
    ? `<div class="row card" style="--gap:12px;padding:12px">${Z.avatar(p, 40)}<span class="small">Ta demande sera envoyée à <b>${Z.esc(Z.displayName(p))}</b> · ${Z.esc(p.metier)}<br><span class="muted">et, s’il n’est pas libre, à 2 autres pros vérifiés de ta zone.</span></span></div>`
    : `<p class="muted">Les pros vérifiés de ta zone te répondent, généralement dans l’heure.</p>`;
  document.getElementById('photo').addEventListener('change', (e) => {
    document.getElementById('up-label').textContent = e.target.files[0] ? e.target.files[0].name : 'Ajouter une photo';
  });
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (Z.validate(e.target)) location.href = 'suivi.html?code=ZK-4821&nouveau=1';
  });
</script>
</body>
</html>
