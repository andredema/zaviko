<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil · Zenviko</title>
<link rel="icon" href="assets/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-base="" class="has-action-bar">
<div id="site-header"></div>
<main id="main"></main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  Z.header(); Z.footer();
  const p = Z.pro(Z.param('id')) || Z.D.pros[0];
  const c = Z.cat(p.cat);
  document.title = `${Z.displayName(p)} · ${p.metier} · Zenviko`;
  const tones = ['#0E9F8E', '#2F6F8F', '#0F2A3D', '#B0743A'];
  const actions = (cls) => `
    <a class="btn btn-primary ${cls}" href="contact.html?id=${p.id}&mode=appel">${Z.icon('phone', 18)}Appeler</a>
    <a class="btn btn-outline ${cls}" href="contact.html?id=${p.id}&mode=texte">${Z.icon('msg', 18)}Écrire</a>
    <a class="btn btn-outline ${cls}" href="devis.html?pro=${p.id}">${Z.icon('file', 18)}Devis</a>`;

  document.getElementById('main').innerHTML = `
    <div class="cover" style="background:${p.couleur}"></div>
    <div class="wrap">
      <div class="profile-head">
        ${Z.avatar(p, 96)}
        <nav class="xsmall muted" aria-label="Fil d’Ariane"><a href="recherche.html">Pros</a> › <a href="recherche.html?cat=${c.id}">${Z.esc(c.nom)}</a></nav>
        <h1 style="font-size:clamp(28px,5vw,40px)">${Z.esc(p.prenom)} ${Z.esc(p.nom)}</h1>
        <p class="muted">${Z.esc(p.metier)} · ${Z.esc(p.secteur)}, ${Z.esc(p.ville)}</p>
        <div class="chips">
          <span class="badge badge-teal">${Z.icon('shield', 14)}Profil vérifié</span>
          <span class="badge badge-amber"><span class="dot ${Z.D.dispo[p.dispo].dot}"></span>${Z.esc(Z.D.dispo[p.dispo].label)}</span>
          <span class="badge badge-gray">${Z.icon('clock', 14)}${Z.esc(p.reponse)}</span>
          <span class="badge badge-gray">${Z.icon('globe', 14)}${p.langues.map(Z.esc).join(' · ')}</span>
        </div>
      </div>

      <div class="profile-layout" style="margin-top:22px">
        <div class="stack" style="--gap:16px">
          <section class="card stack" style="--gap:8px">
            <h2 style="font-size:20px">À propos</h2>
            <p style="color:var(--ink-2)">${Z.esc(p.presentation)}</p>
            <p class="xsmall muted">Membre Zenviko depuis ${p.depuis}</p>
          </section>
          <section class="card stack" style="--gap:4px">
            <h2 style="font-size:20px">Services et tarifs</h2>
            <div class="list-rows">${p.services.map(s => `<div><span>${Z.esc(s[0])}</span><b style="white-space:nowrap">${Z.esc(s[1])}</b></div>`).join('')}</div>
            <p class="xsmall muted">Tarifs indicatifs fixés par le pro. Le prix final est confirmé avant le début du travail.</p>
          </section>
          <section class="card stack" style="--gap:10px">
            <h2 style="font-size:20px">Réalisations</h2>
            <div class="gallery">${[1, 2, 3].map(i => `<span style="background:${tones[(i + p.id.length) % 4]}">Photo ${i}</span>`).join('')}</div>
          </section>
          <section class="card stack" style="--gap:6px">
            <h2 style="font-size:20px">Zones desservies</h2>
            <div class="chips">${p.zones.map(z => `<span class="badge badge-gray">${Z.icon('pin', 14)}${Z.esc(z)}</span>`).join('')}</div>
          </section>
          <section class="card">
            <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">Avis</h2>${Z.stars(p)}</div>
            ${p.avis.map(a => `<div class="review"><div class="row" style="justify-content:space-between"><b>${Z.esc(a.auteur)}</b><span class="stars">${Z.starIcon()}${a.note}</span></div><p style="color:var(--ink-2)">${Z.esc(a.texte)}</p><span class="xsmall muted">${Z.esc(a.date)} · client vérifié par texto</span></div>`).join('')}
          </section>
          <p class="xsmall muted"><a href="#" data-proto="Prototype : le signalement serait envoyé à l’équipe Zenviko.">Signaler ce profil</a></p>
        </div>

        <aside class="card stack sticky-side side-actions" style="--gap:10px">
          <h2 style="font-size:20px">Contacter ${Z.esc(p.prenom)}</h2>
          <p class="small muted">Sans compte. ${Z.esc(p.reponse)}.</p>
          ${actions('btn-block btn-lg')}
        </aside>
      </div>
    </div>
    <div class="action-bar">${actions('')}</div>`;
</script>
</body>
</html>
